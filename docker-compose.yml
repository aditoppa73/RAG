services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - RUN_MODE=production
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_storage:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: rag-ollama-model-init
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        echo 'Attesa avvio servizio Ollama containerizzato...'
        until OLLAMA_HOST=ollama:11434 ollama list > /dev/null 2>&1; do sleep 1; done
        echo 'Verifica modello LLM (gemma2:2b)...'
        OLLAMA_HOST=ollama:11434 ollama pull gemma2:2b
        echo 'Modelli pronti e persistiti in ./ollama_storage.'
      "
    restart: "no"
